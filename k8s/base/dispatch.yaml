apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-dispatch-stable
  namespace: aegisvolt-dev
spec:
  replicas: 4
  selector:
    matchLabels:
      app: energy-dispatch
      track: stable
  template:
    metadata:
      labels:
        app: energy-dispatch
        track: stable
    spec:
      containers:
        - name: energy-dispatch
          image: aegisvolt-dispatch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-dispatch-canary
  namespace: aegisvolt-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energy-dispatch
      track: canary
  template:
    metadata:
      labels:
        app: energy-dispatch
        track: canary
    spec:
      containers:
        - name: energy-dispatch
          image: aegisvolt-dispatch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: energy-dispatch
  namespace: aegisvolt-dev
spec:
  selector:
    app: energy-dispatch
  ports:
    - port: 4003
      targetPort: 4003
