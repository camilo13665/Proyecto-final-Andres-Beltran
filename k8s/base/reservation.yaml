apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-reservation-stable
  namespace: aegisvolt-dev
spec:
  replicas: 4
  selector:
    matchLabels:
      app: station-reservation
      track: stable
  template:
    metadata:
      labels:
        app: station-reservation
        track: stable
    spec:
      containers:
        - name: station-reservation
          image: aegisvolt-reservation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: station-reservation-canary
  namespace: aegisvolt-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: station-reservation
      track: canary
  template:
    metadata:
      labels:
        app: station-reservation
        track: canary
    spec:
      containers:
        - name: station-reservation
          image: aegisvolt-reservation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation
  namespace: aegisvolt-dev
spec:
  selector:
    app: station-reservation
  ports:
    - port: 4001
      targetPort: 4001
