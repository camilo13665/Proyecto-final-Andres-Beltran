apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-stable
  namespace: aegisvolt-dev
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gateway
      track: stable
  template:
    metadata:
      labels:
        app: gateway
        track: stable
    spec:
      containers:
        - name: gateway
          image: aegisvolt-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  namespace: aegisvolt-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
      track: canary
  template:
    metadata:
      labels:
        app: gateway
        track: canary
    spec:
      containers:
        - name: gateway
          image: aegisvolt-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: aegisvolt-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aegisvolt-dev
spec:
  selector:
    app: gateway
  ports:
    - port: 4000
      targetPort: 4000
