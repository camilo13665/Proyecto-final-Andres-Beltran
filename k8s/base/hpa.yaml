apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: station-reservation
  namespace: aegisvolt-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: station-reservation-stable
  minReplicas: 4
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
